[project]
name = "labrys-pipeline"
version = "1.0.0"
description = "Linear A Decipherment Pipeline"
authors = [
    {name = "Labrys Project"},
]
requires-python = ">=3.10"
dependencies = [
    "click>=8.0",
    "lxml>=4.9",
    "Pillow>=9.0",
    "networkx>=3.0",
    "pandas>=2.0",
    "scikit-learn>=1.3",
    "scipy>=1.10",
    "tqdm>=4.65",
    "matplotlib>=3.7",
    "seaborn>=0.12",
    "torch>=2.0",
    "transformers>=4.30",
    "datasets>=2.14",
    "tokenizers>=0.13",
    "accelerate>=0.20",
    "sentencepiece>=0.1",
]

[project.scripts]
labrys = "pipeline.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["pipeline"]
