id: {{id}}
name: {{name}}
family: undeciphered-aegean
sign_system: {{sign_system}}
period_range: "{{period_range}}"
mapping: {{mapping}}
corpus:
  raw: languages/{{id}}/data/raw/corpus.json
  format: sigla-json
  id_field: name
comparative:
  - source: linear-a
    via: null
    grid: data/analysis/comparative/la_cm_shared_phonetic_grid.csv
ingest:
  period_map:
    "": "Uncertain"
  support_map:
    Tablet: "tablet"
pipeline:
  db: languages/{{id}}/data/database/corpus.db
  phases: [positional, ngram, ventris]
oracle:
  threshold: 1.5
